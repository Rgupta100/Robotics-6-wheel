controller_manager:
  ros__parameters:
    update_rate: 100  # Hz -- 2x the node's 50 Hz publish rate

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    swerve_steer_controller:
      type: forward_command_controller/ForwardCommandController

    swerve_drive_controller:
      type: forward_command_controller/ForwardCommandController

# ORDER IS LOAD-BEARING.
#
# ForwardCommandController maps Float64MultiArray[i] onto joints[i]. The node
# fills its arrays by iterating joint_names_ in swerve_optimizer.cpp, which is
# front_left, mid_left, back_left, front_right, mid_right, back_right.
#
# Reordering either list without the other silently drives the wrong wheels --
# the robot still moves, so it does not look like a failure.

swerve_steer_controller:
  ros__parameters:
    joints:
      - front_left_steer_joint
      - mid_left_steer_joint
      - back_left_steer_joint
      - front_right_steer_joint
      - mid_right_steer_joint
      - back_right_steer_joint
    interface_name: position

swerve_drive_controller:
  ros__parameters:
    joints:
      - front_left_wheel_joint
      - mid_left_wheel_joint
      - back_left_wheel_joint
      - front_right_wheel_joint
      - mid_right_wheel_joint
      - back_right_wheel_joint
    interface_name: velocity
